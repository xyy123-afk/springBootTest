# ===== 开发环境配置 =====
server.port=8081

# ===== MySQL 数据源 =====
# 库 xyy_login / 表 users。密码用环境变量占位符：本地没设 DB_PASSWORD 时用默认值 123456，
# 提交到 Git 也不会绑死真实密码；换环境只需设置 DB_PASSWORD 环境变量即可覆盖
spring.datasource.url=jdbc:mysql://localhost:3306/xyy_login?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update：启动时自动核对并补建缺失的表结构，表已提前建好时只做校验
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
