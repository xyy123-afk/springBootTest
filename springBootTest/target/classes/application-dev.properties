# ===== 开发环境配置 =====
server.port=8081

# ===== MySQL 数据源 =====
# 库 xyy_login / 表 users，账号 root / 123456（本地学习环境）
spring.datasource.url=jdbc:mysql://localhost:3306/xyy_login?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update：启动时自动核对并补建缺失的表结构，表已提前建好时只做校验
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
